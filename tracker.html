<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Performance">
<title>Performance Tracker · Thorben Reimer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#161E2E;font-family:-apple-system,'Helvetica Neue',sans-serif;color:#D0DCE8;max-width:430px;margin:0 auto;min-height:100vh}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.hdr{background:#1E2D45;border-bottom:1px solid #2A3A55;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-title{color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px}
.hdr-sub{color:#7A9CC0;font-size:11px;margin-top:2px}
.body{padding:14px 18px 90px}
.card{background:#1E2D45;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #2A3A55}
.card-pu{border-left:3px solid #378ADD}
.card-kz{border-left:3px solid #4CAF82}
.card-myo{border-left:3px solid #F59E0B}
.card-test{border-left:3px solid #A78BFA}
.card-rest{border-left:3px solid #7A9CC0}
.lbl{color:#7A9CC0;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block}
.inp{background:#161E2E;border:1px solid #2A3A55;border-radius:8px;padding:11px;font-size:16px;color:#fff;width:100%;outline:none;text-align:center}
.inp-sm{background:#161E2E;border:1px solid #2A3A55;border-radius:8px;padding:11px 4px;font-size:16px;color:#fff;width:100%;outline:none;text-align:center}
.btn{border:none;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px;color:#fff}
.btn-sm{border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid}
.btn-outline{background:transparent;border:1px solid #2A3A55;color:#7A9CC0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1E2D45;border-top:1px solid #2A3A55;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:14px 0;background:none;border:none;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}
.tag{border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2A3A55}
.row:last-child{border-bottom:none}
.stat{flex:1;text-align:center}
.stat-n{font-size:22px;font-weight:800}
.stat-l{color:#7A9CC0;font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.check{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #2A3A55}
.sets-row{display:flex;gap:8px;margin-bottom:6px}
.set-col{flex:1;text-align:center}
.set-lbl{color:#7A9CC0;font-size:10px;margin-bottom:4px}
.tags-row{display:flex;gap:5px;justify-content:flex-end;align-items:center;flex-wrap:wrap;min-height:22px}
.back-btn{background:none;border:none;color:#7A9CC0;font-size:22px;cursor:pointer;padding:0;line-height:1}
svg.chart{width:100%;overflow:visible}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px}
.banner-test{background:linear-gradient(135deg,#A78BFA22,#378ADD22);border:1px solid #A78BFA40}
.banner-myo{background:linear-gradient(135deg,#F59E0B22,#EF444422);border:1px solid #F59E0B40}
.banner-rest{background:#7A9CC012;border:1px solid #7A9CC030}
.banner-info{background:#378ADD12;border:1px solid #378ADD30}
.target-box{background:#161E2E;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:12px;color:#D0DCE8;line-height:1.6}
.target-box b{color:#7AB8F5}
.history-mini{background:#161E2E;border-radius:8px;padding:8px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.divider{width:1px;background:#2A3A55}
.method-badge{background:#378ADD22;color:#7AB8F5;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CI={bg:"#161E2E",navy:"#1E2D45",sep:"#2A3A55",accent:"#378ADD",light:"#7AB8F5",white:"#FFFFFF",body:"#D0DCE8",muted:"#7A9CC0",green:"#4CAF82",orange:"#F59E0B",red:"#EF4444",purple:"#A78BFA"};

// ============ DAILY CONFIG ============
const START_DATE="2026-05-03"; // Sonntag
const RETEST_INTERVAL=14; // Tage

// Wochenplan: Mo-So
const DAY_PLAN={
  0:{label:"Sonntag",pu:"pyramid",kz:"rest",note:"Pause-Tag · keine Pull-ups · lockerer Lauf möglich"},
  1:{label:"Montag",pu:"pyramid",kz:"cluster",note:"Lauf + Push-ups · Pull-ups abends"},
  2:{label:"Dienstag",pu:"pyramid",kz:"rest",note:"KB-Training abends · keine Pull-ups (Übertraining)"},
  3:{label:"Mittwoch",pu:"pyramid",kz:"rest",note:"Tennis-Coaching abends · keine Pull-ups"},
  4:{label:"Donnerstag",pu:"pyramid",kz:"cluster",note:"Lauf + Push-ups · Pull-ups abends"},
  5:{label:"Freitag",pu:"pyramid",kz:"cluster",note:"Lauf + Push-ups · Pull-ups abends"},
  6:{label:"Samstag",pu:"myorep",kz:"myorep",note:"MYO-REP-TAG · einmal/Woche näher ans Limit"},
};

// ============ WORKOUT CONFIG ============
const WORKOUTS={
  A:{label:"Workout A",subtitle:"Glutes & Posterior Chain",color:CI.accent,day:"Mo & Fr",exercises:[
    {id:"bulgarian_split",name:"Bulgarian Split Squat (KH)",method:"cluster",clusterReps:[6,6,6],pause:30,unit:"kg",
      tip:"3 Cluster-Sätze á 6 Wdh, 30 s Pause dazwischen. RIR 2-3 (du könntest noch 2-3 mehr).",
      progressions:["Wenn 4 Wochen RIR 3 mit gleichem Gewicht → +2kg","ODER: Cluster-Reps von 6 auf 7 erhöhen"]},
    {id:"clamshell",name:"Clamshell (Band)",method:"standard",sets:2,targetReps:14,unit:"Band",
      tip:"2 Sätze á 12-15 Wdh. RIR 5+ (nur Aktivierung Glutes Medius, kein Versagen).",
      progressions:["Aktivierungs-Übung: kein klassisches Upgrade","Bei 2×15 sauber → mittleres Band"]},
    {id:"hip_thrust",name:"Hip Thrust (KH)",method:"cluster",clusterReps:[6,6,6],pause:30,unit:"kg",
      tip:"3 Cluster-Sätze á 6 Wdh, 30 s Pause. RIR 2-3.",
      progressions:["Wenn 4 Wochen RIR 3 → +2kg","ODER Cluster-Reps auf 7 erhöhen"]},
    {id:"rdl",name:"Romanian Deadlift",method:"cluster",clusterReps:[6,6,6],pause:30,unit:"kg",
      tip:"3 Cluster-Sätze á 6 Wdh, 30 s Pause. RIR 2-3. Bewegung kontrolliert, Hüfte schiebt nach hinten.",
      progressions:["Wenn 4 Wochen RIR 3 → +2kg","→ Single-Leg RDL als Variation"]},
  ]},
  B:{label:"Workout B",subtitle:"Core nach McGill (Big Three)",color:CI.green,day:"Mi",exercises:[
    {id:"dead_bug",name:"Dead Bug ① (McGill-Pyramide)",method:"mcgill",pyramid:[5,4,3],pause:10,unit:"BW",
      tip:"Pro Seite: 5 → 10s Pause → 4 → 10s → 3. NIEMALS Versagen, Wirbelsäule bleibt flach.",
      progressions:["Wenn Pyramide 5-4-3 sauber → 6-5-4","→ mit Band an Armen","→ mit KH in Händen"]},
    {id:"side_plank",name:"Side Plank ② (McGill-Pyramide)",method:"mcgill",pyramid:[30,20,10],pause:10,unit:"Sek",
      tip:"30s → 10s Pause → 20s → 10s → 10s pro Seite. Nicht zittern, kein Zusammenbrechen.",
      progressions:["Wenn 30-20-10 sauber → 40-30-20","→ +Hip Dip","→ Side Plank Row"]},
    {id:"pallof",name:"Pallof Press ③",method:"standard",sets:2,targetReps:9,unit:"Band",
      tip:"2 Sätze á 8-10 Wdh pro Seite. RIR 3-4. Anti-Rotation = volle Kontrolle wichtiger als Reps.",
      progressions:["Bei 2×10 sauber → mittleres Band","→ Abstand zum Anker vergrößern","→ im Einbeinstand"]},
    {id:"atw",name:"Around the World",method:"standard",sets:2,targetReps:9,unit:"Band",
      tip:"2 Sätze á 8-10 Wdh pro Seite. RIR 3-4. Großer Kreis, Rumpf stabil.",
      progressions:["Bei 2×10 sauber → mittleres Band","→ Tempo verlangsamen (3 s pro Kreis)"]},
  ]},
};

// ============ HELPERS ============
const todayKey=()=>new Date().toISOString().split("T")[0];
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0;
const fmt=d=>d.slice(5);

// LocalStorage Keys
const LS_WO="pt_workouts_v3";
const LS_DAILY="pt_daily_v3";
const LS_MAX="pt_max_v3";
const LS_TAB="pt_tab_v3";

const loadWO=()=>{try{return JSON.parse(localStorage.getItem(LS_WO))||[]}catch{return[]}};
const saveWO=d=>{try{localStorage.setItem(LS_WO,JSON.stringify(d))}catch{}};
const loadDaily=()=>{try{return JSON.parse(localStorage.getItem(LS_DAILY))||[]}catch{return[]}};
const saveDaily=d=>{try{localStorage.setItem(LS_DAILY,JSON.stringify(d))}catch{}};
const loadMax=()=>{try{return JSON.parse(localStorage.getItem(LS_MAX))||{pu:null,kz:null,puHistory:[],kzHistory:[]}}catch{return{pu:null,kz:null,puHistory:[],kzHistory:[]}}};
const saveMax=d=>{try{localStorage.setItem(LS_MAX,JSON.stringify(d))}catch{}};
const loadTab=()=>{try{return localStorage.getItem(LS_TAB)||"daily"}catch{return"daily"}};
const saveTab=t=>{try{localStorage.setItem(LS_TAB,t)}catch{}};

// ============ DAILY CALCULATIONS ============
function calcPushupReps(maxPU,type){
  if(!maxPU||maxPU<5)return null;
  if(type==="pyramid"){
    const s1=Math.round(maxPU*0.6);
    const s2=Math.round(maxPU*0.72);
    const s3=Math.round(maxPU*0.66);
    return{type:"pyramid",sets:[s1,s2,s3],rir:[maxPU-s1,maxPU-s2,maxPU-s3],total:s1+s2+s3,
      label:"Lauf-Pyramide · 3 Stopps",
      desc:`Stopp 1 (Anfang Lauf), Stopp 2 (Mitte), Stopp 3 (vor Ende). RIR ${maxPU-s2}-${maxPU-s1}.`};
  }
  if(type==="myorep"){
    const act=Math.round(maxPU*0.88);
    const m1=Math.max(3,Math.round(maxPU*0.22));
    const m2=Math.max(3,Math.round(maxPU*0.18));
    const m3=Math.max(2,Math.round(maxPU*0.15));
    const m4=Math.max(2,Math.round(maxPU*0.12));
    return{type:"myorep",sets:[act,m1,m2,m3,m4],rir:[3,1,1,1,0],total:act+m1+m2+m3+m4,
      label:"Myo-Rep · Spitzenreiz",
      desc:"Aktivierung (RIR 3) → 4× Mini-Sätze mit 15 s Pause."};
  }
  return null;
}

function getPullupMode(maxKZ){
  if(!maxKZ||maxKZ<1)return null;
  if(maxKZ<=3)return "beginner";  // GtG + Negativs
  if(maxKZ<=7)return "cluster";    // Klassisches Cluster
  return "advanced";                // Größere Cluster
}

function calcPullupReps(maxKZ,type){
  if(!maxKZ||maxKZ<1)return null;
  const mode=getPullupMode(maxKZ);
  
  // ==== BEGINNER MODE: Max 1-3 sauber ====
  if(mode==="beginner"){
    if(type==="cluster"){
      // Greasing the Groove: 4-5 Mini-Sätze á 1 Rep (oder Max-1)
      const repsPerSet=Math.max(1,maxKZ-1);
      return{type:"gtg",sets:[repsPerSet,repsPerSet,repsPerSet,repsPerSet,repsPerSet],rir:[1,1,1,1,1],total:repsPerSet*5,
        label:"Greasing the Groove · 5 × "+repsPerSet+" Rep",
        desc:`5 Mini-Sätze á ${repsPerSet} sauberer FROM-Pull-up. 60-90 s Pause zwischen Sätzen. NIE bis Versagen.`,
        mode:"beginner"};
    }
    if(type==="myorep"){
      // Negativ-Reps am Samstag
      return{type:"negativ",sets:[4,4,4],rir:[null,null,null],total:12,
        label:"Negativ-Reps · 3 × 4 exzentrisch",
        desc:"Hochspringen → kontrolliert in 5 Sek absenken. 3 Sätze á 4 Negativs. 90 s Pause. Danach 1 Test-Rep wenn Lust.",
        mode:"beginner"};
    }
  }
  
  // ==== CLUSTER MODE: Max 4-7 ====
  if(mode==="cluster"){
    if(type==="cluster"){
      const baseRep=Math.max(2,Math.round(maxKZ*0.6));
      const lastRep=Math.max(1,baseRep-1);
      return{type:"cluster",sets:[baseRep,baseRep,baseRep,lastRep],rir:[maxKZ-baseRep,maxKZ-baseRep,maxKZ-baseRep,maxKZ-lastRep],total:baseRep*3+lastRep,
        label:"Cluster · 4 Mini-Sätze",
        desc:`30 s Pause zwischen Sätzen. FROM (Dead Hang Start, Brust zur Stange). RIR ${maxKZ-baseRep}.`,
        mode:"cluster"};
    }
    if(type==="myorep"){
      const act=Math.max(2,maxKZ-1);
      const m1=Math.max(1,Math.round(maxKZ*0.4));
      const m2=Math.max(1,Math.round(maxKZ*0.35));
      const m3=Math.max(1,Math.round(maxKZ*0.3));
      return{type:"myorep",sets:[act,m1,m2,m3],rir:[1,1,1,0],total:act+m1+m2+m3,
        label:"Myo-Rep · Spitzenreiz",
        desc:"Aktivierung 1 vor Versagen, dann 3× Mini mit 15 s Pause.",
        mode:"cluster"};
    }
  }
  
  // ==== ADVANCED MODE: Max 8+ ====
  if(mode==="advanced"){
    if(type==="cluster"){
      const baseRep=Math.max(5,Math.round(maxKZ*0.6));
      const lastRep=Math.max(4,baseRep-1);
      return{type:"cluster",sets:[baseRep,baseRep,baseRep,lastRep],rir:[maxKZ-baseRep,maxKZ-baseRep,maxKZ-baseRep,maxKZ-lastRep],total:baseRep*3+lastRep,
        label:"Cluster Advanced · 4 Mini-Sätze",
        desc:`30 s Pause zwischen Sätzen. FROM. RIR ${maxKZ-baseRep}. Bei Stagnation: Tempo verlangsamen oder Gewicht hinzu.`,
        mode:"advanced"};
    }
    if(type==="myorep"){
      const act=Math.max(6,maxKZ-1);
      const m1=Math.max(3,Math.round(maxKZ*0.4));
      const m2=Math.max(3,Math.round(maxKZ*0.35));
      const m3=Math.max(2,Math.round(maxKZ*0.3));
      return{type:"myorep",sets:[act,m1,m2,m3],rir:[1,1,1,0],total:act+m1+m2+m3,
        label:"Myo-Rep Advanced",
        desc:"Aktivierung 1 vor Versagen, dann 3× Mini mit 15 s Pause. Bei Plateau: Gewicht hinzu.",
        mode:"advanced"};
    }
  }
  return null;
}

// ============ DATE / RETEST LOGIC ============
function daysSinceStart(){
  const start=new Date(START_DATE);
  const today=new Date(todayKey());
  return Math.floor((today-start)/(86400000));
}

function nextRetestInDays(){
  const d=daysSinceStart();
  if(d<0)return -d;
  const cycle=d%RETEST_INTERVAL;
  return RETEST_INTERVAL-cycle;
}

function isRetestDay(){
  const d=daysSinceStart();
  return d>0&&d%RETEST_INTERVAL===0;
}

function todayDayOfWeek(){
  return new Date(todayKey()).getDay();
}

// ============ STATE ============
let S={
  tab:loadTab(),
  workouts:loadWO(),
  daily:loadDaily(),
  max:loadMax(),
  // Daily form
  dailyPU:[],dailyKZ:[],dailyNote:"",dailyRPE:null,
  // Workout form
  activeWorkout:null,activeWoForm:{},woSaved:false,
  // Detail views
  progressEx:null,
  // Setup
  showSetup:false,maxPUInput:"",maxKZInput:""
};

const set=p=>{Object.assign(S,p);if(p.tab)saveTab(p.tab);render()};

// ============ TAGS / CHARTS ============
const tag=(t,c)=>`<span class="tag" style="background:${c}22;color:${c}">${t}</span>`;

function svgLine(data,key,color,h){
  h=h||80;const vals=data.map(d=>d[key]).filter(v=>v!=null&&v>0);if(vals.length<2)return"";
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,W=300,H=h;
  const pts=data.filter(d=>d[key]>0).map((d,i,a)=>({x:i/(a.length-1||1)*W,y:H-(d[key]-mn)/rng*(H-10)-5,v:d[key],l:d.label}));
  const path=pts.map((p,i)=>(i?"L":"M")+p.x+","+p.y).join(" ");
  const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"><title>${p.l}: ${p.v}</title></circle>`).join("");
  const lbs=pts.filter((_,i)=>i===0||i===pts.length-1||pts.length<=5).map(p=>`<text x="${p.x}" y="${H+14}" text-anchor="middle" fill="#7A9CC0" font-size="9">${p.l}</text>`).join("");
  return`<svg class="chart" viewBox="0 0 ${W} ${H+18}" height="${H+18}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbs}</svg>`;
}

// ============ NAV ============
function navHtml(){
  return`<nav class="nav">
    <button class="nav-btn" style="color:${S.tab==='daily'?CI.accent:CI.muted}" onclick="set({tab:'daily'})">⊕ Daily</button>
    <button class="nav-btn" style="color:${S.tab==='workout'?CI.accent:CI.muted}" onclick="set({tab:'workout'})">⊞ Workout</button>
    <button class="nav-btn" style="color:${S.tab==='verlauf'?CI.accent:CI.muted}" onclick="set({tab:'verlauf'})">↗ Verlauf</button>
  </nav>`;
}

// ============ DAILY VIEW ============
function renderDaily(){
  const today=todayKey();
  const dow=todayDayOfWeek();
  const plan=DAY_PLAN[dow];
  const max=S.max;

  // Setup wenn keine Maxwerte da
  if(!max.pu||!max.kz||S.showSetup){
    return renderSetup();
  }

  // Re-Test Banner
  const isRetest=isRetestDay();
  const daysToRetest=nextRetestInDays();
  const daysSince=daysSinceStart();

  let banner="";
  if(isRetest){
    banner=`<div class="banner banner-test">
      <div style="color:${CI.purple};font-weight:800;font-size:14px;margin-bottom:4px">🎯 Re-Test heute!</div>
      <div style="color:#D0DCE8;font-size:12px;margin-bottom:8px">Tag ${daysSince} · alle 14 Tage Maxwert prüfen</div>
      <button class="btn-sm" style="background:${CI.purple};color:#fff;border-color:${CI.purple}" onclick="set({showSetup:true})">Maxwerte aktualisieren →</button>
    </div>`;
  }else if(daysToRetest<=2){
    banner=`<div class="banner banner-info">
      <div style="color:${CI.light};font-weight:700;font-size:12px">📅 Re-Test in ${daysToRetest} Tag(en)</div>
    </div>`;
  }

  // Heute schon eingetragen?
  const todayEntry=S.daily.find(d=>d.date===today);

  // Push-up Daten
  const puData=calcPushupReps(max.pu,plan.pu);
  const kzData=plan.kz==="rest"?null:calcPullupReps(max.kz,plan.kz);

  // PU Card
  let puCard="";
  if(plan.pu==="myorep"){
    puCard=renderExerciseCard("pu",puData,"Push-ups Myo-Rep",CI.orange,"card-myo",max.pu,"Push-ups");
  }else{
    puCard=renderExerciseCard("pu",puData,"Push-ups Lauf-Pyramide",CI.accent,"card-pu",max.pu,"Push-ups");
  }

  // KZ Card
  let kzCard="";
  if(plan.kz==="rest"){
    kzCard=`<div class="card card-rest">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div style="font-size:24px">🛌</div>
        <div style="flex:1">
          <div style="color:#fff;font-weight:700;font-size:14px">Pull-ups · Pause</div>
          <div style="color:#7A9CC0;font-size:11px;margin-top:2px">${plan.note}</div>
        </div>
      </div>
    </div>`;
  }else if(plan.kz==="myorep"){
    const titleMyo=kzData?.mode==="beginner"?"Pull-ups · Negativ-Reps (Sa)":"Pull-ups · Myo-Rep";
    kzCard=renderExerciseCard("kz",kzData,titleMyo,CI.orange,"card-myo",max.kz,"Pull-ups (FROM)");
  }else{
    const titleStd=kzData?.mode==="beginner"?"Pull-ups · GtG-Methode":"Pull-ups · Cluster";
    kzCard=renderExerciseCard("kz",kzData,titleStd,CI.green,"card-kz",max.kz,"Pull-ups (FROM)");
  }

  // Header Stats
  const weekStart=new Date(today);weekStart.setDate(weekStart.getDate()-6);
  const weekStartStr=weekStart.toISOString().split("T")[0];
  const thisWeek=S.daily.filter(d=>d.date>=weekStartStr);
  const weekPU=thisWeek.reduce((s,d)=>s+(d.puTotal||0),0);
  const weekKZ=thisWeek.reduce((s,d)=>s+(d.kzTotal||0),0);
  const streak=calculateStreak();

  return`<div class="hdr">
    <div><div class="hdr-title">DAILY · ${plan.label}</div><div class="hdr-sub">${today} · Tag ${daysSince+1} · ${todayEntry?'<span style="color:'+CI.green+'">eingetragen</span>':'noch offen'}</div></div>
    <button class="btn-sm" style="background:#2A3A55;color:#7A9CC0;border-color:#2A3A55;font-size:10px" onclick="set({showSetup:true})">⚙</button>
  </div>
  <div class="body">
    ${banner}
    <div class="card" style="display:flex;margin-bottom:14px">
      <div class="stat"><div class="stat-n" style="color:${CI.accent}">${max.pu||"—"}</div><div class="stat-l">Max PU</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="stat-n" style="color:${CI.green}">${max.kz||"—"}</div><div class="stat-l">Max KZ</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="stat-n" style="color:${CI.light}">${weekPU}</div><div class="stat-l">PU Woche</div></div>

function initExForm(ex){
  if(ex.method==="cluster"){
    return{weight:"",sets:Array(ex.clusterReps.length).fill("")};
  }
  if(ex.method==="mcgill"){
    return{weight:"",sets:Array(ex.pyramid.length).fill("")};
  }
  if(ex.method==="standard"){
    return{weight:"",sets:Array(ex.sets).fill("")};
  }
  return{weight:"",sets:[""]};
}

function renderExerciseEditor(ex,e,woColor){
  let methodInfo="";
  let targetSets=[];
  let methodBadge="";
  if(ex.method==="cluster"){
    targetSets=ex.clusterReps;
    methodBadge="Cluster";
    methodInfo=`${ex.clusterReps.length} Sätze á ${ex.clusterReps[0]} Wdh · ${ex.pause} s Pause · RIR 2-3`;
  }else if(ex.method==="mcgill"){
    targetSets=ex.pyramid;
    methodBadge="McGill";
    methodInfo=`Absteigend ${ex.pyramid.join("→")} ${ex.unit==="Sek"?"s":"Wdh"} · ${ex.pause} s Pause · NICHT bis Versagen`;
  }else if(ex.method==="standard"){
    targetSets=Array(ex.sets).fill(ex.targetReps);
    methodBadge="Standard";
    methodInfo=`${ex.sets} Sätze á ${ex.targetReps} ${ex.unit==="Sek"?"s":"Wdh"} · RIR 3-5`;
  }

  const ra=e.sets.map(Number).filter(n=>n>0);
  const total=ra.reduce((a,b)=>a+b,0);
  const targetTotal=targetSets.reduce((a,b)=>a+b,0);

  const isBW=ex.unit==="BW"||ex.unit==="Sek";
  const isKg=ex.unit==="kg";
  const isBand=ex.unit==="Band";

  const wf=!isBW?`<div style="margin-bottom:10px">
    <label class="lbl">${isKg?'Gewicht (kg)':'Band-Stärke'}</label>
    <input class="inp" type="${isKg?'number':'text'}" inputmode="${isKg?'numeric':'text'}" placeholder="${isKg?(e.weight?'Letzte: '+e.weight:'z.B. 16'):'leicht / mittel / stark'}" value="${e.weight}" oninput="upWoWeight('${ex.id}',this.value)">
  </div>`:'';

  const sets=`<div class="sets-row">${e.sets.map((v,i)=>{
    const target=targetSets[i];
    const n=Number(v);
    const bc=n>0?(n>=target?CI.green:n>=target*.7?CI.orange:CI.muted):CI.sep;
    return`<div class="set-col">
      <div class="set-lbl">S${i+1}</div>
      <div style="color:${woColor};font-size:9px;font-weight:700;margin-bottom:3px">Ziel: ${target}</div>
      <input id="wo_${ex.id}_${i}" class="inp-sm" type="number" inputmode="numeric" style="border-color:${bc}" placeholder="${target}" value="${v}" oninput="upWoSet('${ex.id}',${i},this.value)">
    </div>`;
  }).join('')}</div>`;

  return`<div class="card" style="border-left:3px solid ${woColor}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div style="flex:1">
        <div style="color:#fff;font-weight:700;font-size:14px;margin-bottom:3px">${ex.name}</div>
        <span class="method-badge" style="background:${woColor}22;color:${woColor}">${methodBadge}</span>
      </div>
      <div id="wototal_${ex.id}" style="color:${woColor};font-weight:800;font-size:16px;display:${total?'block':'none'}">${total?total+"/"+targetTotal:""}</div>

    <label class="lbl">${ex.unit==="Sek"?"Sekunden pro Satz":"Wdh pro Satz"}</label>

}

function buildWoData(exId){
  return S.workouts.filter(s=>s.exercises&&s.exercises[exId]).map(s=>{

    return{date:s.date,label:fmt(s.date),avg:avg(r),weight:parseFloat(e.weight)||0};
  }).sort((a,b)=>a.date.localeCompare(b.date));
}

// ============ HELPER FUNCTIONS ============
function calculateStreak(){
  if(!S.daily.length)return 0;
  let s=0;
  const today=new Date(todayKey());
  for(let i=0;i<60;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const dStr=d.toISOString().split("T")[0];
    const entry=S.daily.find(e=>e.date===dStr);
    if(entry&&((entry.puTotal||0)>0||(entry.kzTotal||0)>0))s++;
    else if(i>0)break;
  }
  return s;
}

  const todayEntry=S.daily.find(d=>d.date===today);
  if(todayEntry&&!S._loaded){
    S.dailyPU=todayEntry.pu||[];
    S.dailyKZ=todayEntry.kz||[];
    S._loaded=true;
  }
}

// ============ EVENT HANDLERS ============
window.set=set;

window.updMaxInput=(type,val)=>{
  if(type==="pu")S.maxPUInput=val;
  else S.maxKZInput=val;
  // Direktes Update der Mode-Anzeige (nur bei KZ relevant)
  if(type==="kz")refreshModeDisplay();
};

function refreshModeDisplay(){
  const currentMaxKZ=parseInt(S.maxKZInput)||S.max.kz||0;
  const currentMode=getPullupMode(currentMaxKZ);
  const modeInfo={
    "beginner":{name:"Beginner-Modus",color:CI.purple,desc:"GtG (5×1 Rep) + Negativs am Samstag · für Max 1-3"},
    "cluster":{name:"Cluster-Modus",color:CI.green,desc:"Klassisches Cluster (4 Sätze) + Myo-Rep · für Max 4-7"},
    "advanced":{name:"Advanced-Modus",color:CI.accent,desc:"Größere Cluster · für Max 8+"}
  };
  const el=document.getElementById("mode_display");
  if(!el)return;
  if(!currentMode){el.style.display="none";return;}
  const m=modeInfo[currentMode];
  el.style.display="block";
  el.style.background=m.color+"18";
  el.style.borderColor=m.color+"40";
  el.innerHTML=`<div style="color:${m.color};font-size:11px;font-weight:700;margin-bottom:4px">→ ${m.name}</div><div style="color:#D0DCE8;font-size:11px;line-height:1.5">${m.desc}</div>`;
}

window.upDailySet=(type,i,val)=>{
  const arr=type==="pu"?[...S.dailyPU]:[...S.dailyKZ];
  arr[i]=val;
  if(type==="pu")S.dailyPU=arr;else S.dailyKZ=arr;
  // Direktes DOM-Update ohne render() - Input behält Fokus
  refreshDailyCard(type);
};

function refreshDailyCard(type){
  const dow=todayDayOfWeek();
  const plan=DAY_PLAN[dow];
  const max=S.max;
  const formArr=type==="pu"?S.dailyPU:S.dailyKZ;
  const planType=type==="pu"?plan.pu:plan.kz;
  const data=type==="pu"?calcPushupReps(max.pu,planType):calcPullupReps(max.kz,planType);
  if(!data)return;
  
  // Border-Farben pro Input updaten
  const targets=data.sets;
  formArr.forEach((v,i)=>{
    const inp=document.getElementById(type+"_"+i);
    if(!inp)return;
    const n=Number(v);
    const target=targets[i];
    const bc=n>0?(n>=target?CI.green:n>=target*.7?CI.orange:CI.muted):CI.sep;
    inp.style.borderColor=bc;
  });
  
  // Total + Prozent updaten
  const ra=formArr.map(Number).filter(n=>n>0);
  const total=ra.reduce((a,b)=>a+b,0);
  const targetTotal=data.total;
  const pct=Math.round(total/targetTotal*100)||0;
  const totalEl=document.getElementById("total_"+type);
  const pctEl=document.getElementById("pct_"+type);
  if(totalEl)totalEl.textContent=total||"—";
  if(pctEl){
    if(total>0){
      pctEl.style.display="block";
      pctEl.textContent=pct+"%";
      pctEl.style.color=pct>=90?CI.green:pct>=70?CI.orange:CI.muted;
    }else{
      pctEl.style.display="none";
    }
  }
}

window.saveDailyEntry=()=>{
  const today=todayKey();
  const dow=todayDayOfWeek();
  const plan=DAY_PLAN[dow];
  const puTotal=S.dailyPU.map(Number).filter(n=>n>0).reduce((a,b)=>a+b,0);
  const kzTotal=S.dailyKZ.map(Number).filter(n=>n>0).reduce((a,b)=>a+b,0);
  const entry={
    date:today,
    pu:[...S.dailyPU],
    kz:[...S.dailyKZ],
    puTotal,
    kzTotal,
    isMyo:plan.pu==="myorep",
    savedAt:Date.now()
  };
  S.daily=[...S.daily.filter(d=>d.date!==today),entry];
  saveDaily(S.daily);
  render();
};

window.saveMaxes=()=>{
  const newPU=parseInt(S.maxPUInput)||S.max.pu;
  const newKZ=parseInt(S.maxKZInput)||S.max.kz;
  if(!newPU||!newKZ){alert("Bitte beide Werte eingeben.");return;}
  const today=todayKey();
  const newMax={
    pu:newPU,
    kz:newKZ,
    puHistory:[...(S.max.puHistory||[]).filter(h=>h.date!==today),{date:today,value:newPU}],
    kzHistory:[...(S.max.kzHistory||[]).filter(h=>h.date!==today),{date:today,value:newKZ}],
  };
  S.max=newMax;
  saveMax(newMax);
  set({showSetup:false,maxPUInput:"",maxKZInput:""});
};

window.startWorkout=t=>{
  const last=[...S.workouts].reverse().find(s=>s.type===t);
  const init={};
  WORKOUTS[t].exercises.forEach(ex=>{
    const lastEx=last?.exercises?.[ex.id];
    const ef=initExForm(ex);
    if(lastEx?.weight)ef.weight=lastEx.weight;
    init[ex.id]=ef;
  });
  set({activeWorkout:t,activeWoForm:init,woSaved:false});
};

window.upWoWeight=(id,val)=>{
  S.activeWoForm[id]={...S.activeWoForm[id],weight:val};
};

window.upWoSet=(id,i,val)=>{
  const e=S.activeWoForm[id];
  const sets=[...e.sets];
  sets[i]=val;
  S.activeWoForm[id]={...e,sets};
  // Direktes DOM-Update ohne render()
  refreshWoCard(id);
};

function refreshWoCard(id){
  if(!S.activeWorkout)return;
  const wo=WORKOUTS[S.activeWorkout];
  const ex=wo.exercises.find(e=>e.id===id);
  if(!ex)return;
  const e=S.activeWoForm[id];
  
  let targetSets=[];
  if(ex.method==="cluster")targetSets=ex.clusterReps;
  else if(ex.method==="mcgill")targetSets=ex.pyramid;
  else if(ex.method==="standard")targetSets=Array(ex.sets).fill(ex.targetReps);
  
  // Border-Farben pro Input
  e.sets.forEach((v,i)=>{
    const inp=document.getElementById("wo_"+id+"_"+i);
    if(!inp)return;
    const n=Number(v);
    const target=targetSets[i];
    const bc=n>0?(n>=target?CI.green:n>=target*.7?CI.orange:CI.muted):CI.sep;
    inp.style.borderColor=bc;
  });
  
  // Total updaten
  const ra=e.sets.map(Number).filter(n=>n>0);
  const total=ra.reduce((a,b)=>a+b,0);
  const targetTotal=targetSets.reduce((a,b)=>a+b,0);
  const totalEl=document.getElementById("wototal_"+id);
  if(totalEl){
    if(total>0){
      totalEl.style.display="block";
      totalEl.textContent=total+"/"+targetTotal;
    }else{
      totalEl.style.display="none";
    }
  }
}

window.saveWorkoutSession=()=>{
  const entry={date:todayKey(),type:S.activeWorkout,exercises:S.activeWoForm};
  S.workouts=[...S.workouts.filter(s=>!(s.date===entry.date&&s.type===entry.type)),entry];
  saveWO(S.workouts);
  set({woSaved:true});
};

// ============ INIT ============
S._loaded=false;
render();
</script>
</body>
</html>
