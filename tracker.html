<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Performance Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#161E2E;font-family:-apple-system,'Helvetica Neue',sans-serif;color:#D0DCE8;max-width:430px;margin:0 auto;min-height:100vh}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.hdr{background:#1E2D45;border-bottom:1px solid #2A3A55;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-title{color:#fff;font-size:16px;font-weight:800;letter-spacing:.3px}
.hdr-sub{color:#7A9CC0;font-size:11px;margin-top:2px}
.body{padding:14px 18px 90px}
.card{background:#1E2D45;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #2A3A55}
.lbl{color:#7A9CC0;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block}
.inp{background:#161E2E;border:1px solid #2A3A55;border-radius:8px;padding:11px;font-size:16px;color:#fff;width:100%;outline:none;text-align:center}
.inp-sm{background:#161E2E;border:1px solid #2A3A55;border-radius:8px;padding:8px 6px;font-size:15px;color:#fff;outline:none;text-align:center}
select.inp-sm{-webkit-appearance:none;appearance:none;cursor:pointer}
.btn{border:none;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px;color:#fff}
.btn-sm{border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid}
.back-btn{background:none;border:none;color:#7A9CC0;font-size:22px;cursor:pointer;padding:0;line-height:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1E2D45;border-top:1px solid #2A3A55;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:14px 0;background:none;border:none;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}
.tag{border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2A3A55}
.stat{flex:1;text-align:center}
.stat-n{font-size:22px;font-weight:800}
.stat-l{color:#7A9CC0;font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.check{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #2A3A55}
.prog-box{border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px;font-weight:600}
.tags-row{display:flex;gap:5px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:8px}
.drop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.drop-lbl{color:#7A9CC0;font-size:10px;font-weight:700;width:44px;flex-shrink:0;letter-spacing:.5px}
.col-hdr{color:#7A9CC0;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
svg.chart{width:100%;overflow:visible}
.prog-steps{background:rgba(42,58,85,.4);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.prog-step{color:#7A9CC0;font-size:11px;margin-bottom:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CI={bg:"#161E2E",navy:"#1E2D45",sep:"#2A3A55",accent:"#378ADD",light:"#7AB8F5",white:"#FFFFFF",body:"#D0DCE8",muted:"#7A9CC0",green:"#4CAF82",orange:"#F59E0B",purple:"#A78BFA",red:"#EF4444"};

// Intensity hierarchies (hardest → easiest, for dropping)
const BAND_LEVELS=["stark","mittel","leicht"];
const BW_HIERARCHY={
  pushup:["Normal (Boden)","Hände auf Box"],
  dead_bug:["Mit KH","Mit Med Ball","BW"],
};

const WORKOUTS={
  A:{label:"Workout A",subtitle:"Glutes & Posterior Chain",color:CI.accent,day:"Mo & Fr",exercises:[
    {id:"bulgarian_split",name:"Bulgarian Split Squat (KH)",targetReps:10,unit:"kg",
      progressions:["+2kg Startgewicht wenn erster Drop ≥11 Wdh","→ Tempo 3 Sek runter"]},
    {id:"clamshell",name:"Clamshell (Band)",targetReps:12,unit:"Band",
      progressions:["Stärkeres Band als Startintensität","→ + Gewicht am Knöchel"]},
    {id:"hip_thrust",name:"Hip Thrust (KH)",targetReps:12,unit:"kg",
      progressions:["+2kg Startgewicht wenn erster Drop ≥13 Wdh","→ Barbell Hip Thrust"]},
    {id:"rdl",name:"Romanian Deadlift",targetReps:10,unit:"kg",
      progressions:["+2kg Startgewicht wenn erster Drop ≥11 Wdh","→ Single-Leg RDL"]},
  ]},
  B:{label:"Workout B",subtitle:"McGill Big Three + ATW",color:CI.green,day:"Mi",exercises:[
    {id:"dead_bug",name:"Dead Bug",targetReps:8,unit:"BW",
      progressions:["Schwerere Variation als Start: Mit KH → Mit Med Ball → BW","→ 5 Sek halten pro Wdh"]},
    {id:"side_plank",name:"Side Plank",targetReps:30,unit:"Sek",
      progressions:["+ Hip Dip als Drop-Variation","→ Side Plank Row"]},
    {id:"pallof",name:"Pallof Press",targetReps:10,unit:"Band",
      progressions:["Stärkeres Band als Start","→ Einbeinstand"]},
    {id:"atw",name:"Around the World",targetReps:8,unit:"Band",
      progressions:["Stärkeres Band als Start","→ Tempo 3 Sek pro Kreis"]},
  ]},
  C:{label:"Workout C",subtitle:"Full Body – Pull & Push",color:CI.purple,day:"Sa (optional)",exercises:[
    {id:"pullup",name:"Pull-ups (Klimmzüge)",targetReps:5,unit:"kg",
      progressions:["+2kg Startgewicht","→ schrittweise steigern"]},
    {id:"pushup",name:"Push-ups",targetReps:15,unit:"BW",
      progressions:["Schwerere Variation: Normal (Boden) → Hände auf Box","→ Archer Push-up"]},
    {id:"goblet_squat",name:"Goblet Squat (KH)",targetReps:12,unit:"kg",
      progressions:["+2kg Startgewicht wenn erster Drop ≥13 Wdh"]},
    {id:"renegade_row",name:"Renegade Row (KH)",targetReps:8,unit:"kg",
      progressions:["+2kg Startgewicht","→ Tempo 2 Sek hoch, 2 runter"]},
  ]},
};

const todayKey=()=>new Date().toISOString().split("T")[0];
const persist=d=>{try{localStorage.setItem("tr_v3",JSON.stringify(d))}catch{}};
const loadSessions=()=>{try{const r=localStorage.getItem("tr_v3");return r?JSON.parse(r):[]}catch{return[]}};
const getAllEx=()=>[...WORKOUTS.A.exercises,...WORKOUTS.B.exercises,...WORKOUTS.C.exercises];

let S={view:"home",activeType:null,sessions:loadSessions(),form:{},saved:false,progResults:{},showProg:{},progressEx:null};
const set=p=>{Object.assign(S,p);render()};

// ── INTENSITY HELPERS ──
function getInitialIntensity(ex, lastEntry){
  const suggested=lastEntry?.suggestedNextIntensity;
  const lastFirst=lastEntry?.drops?.[0]?.intensity;
  if(ex.unit==="kg") return suggested??lastFirst??"";
  if(ex.unit==="Band") return suggested??lastFirst??"mittel";
  const hier=BW_HIERARCHY[ex.id];
  return suggested??lastFirst??(hier?hier[0]:"BW");
}

function getNextDropIntensity(ex, prevIntensity){
  if(ex.unit==="kg"){
    const kg=parseFloat(prevIntensity)||0;
    return kg>=4?String(kg-2):prevIntensity;
  }
  if(ex.unit==="Band"){
    const idx=BAND_LEVELS.indexOf((prevIntensity||"").toLowerCase());
    return idx>=0&&idx<BAND_LEVELS.length-1?BAND_LEVELS[idx+1]:BAND_LEVELS[BAND_LEVELS.length-1];
  }
  const hier=BW_HIERARCHY[ex.id];
  if(hier){
    const idx=hier.indexOf(prevIntensity);
    return idx>=0&&idx<hier.length-1?hier[idx+1]:hier[hier.length-1];
  }
  return prevIntensity;
}

// ── PROGRESSION CALC (based on first/start drop) ──
function calcProg(ex, drops){
  if(!drops||!drops.length)return null;
  const first=drops[0];
  const firstReps=Number(first?.reps)||0;
  if(!firstReps)return null;

  if(firstReps>=ex.targetReps*1.10){
    if(ex.unit==="kg"){
      const n=(parseFloat(first.intensity)||0)+2;
      return{level:"increase",msg:"🚀 Startgewicht erhöhen → "+n+" kg",nextIntensity:String(n)};
    }
    if(ex.unit==="Band"){
      const idx=BAND_LEVELS.indexOf((first.intensity||"").toLowerCase());
      const next=idx>0?BAND_LEVELS[idx-1]:null;
      return{level:"increase",msg:next?"🚀 Stärker starten → Band "+next:"🚀 Abstand vergrößern",nextIntensity:next||first.intensity};
    }
    if(ex.unit==="BW"||ex.unit==="Sek"){
      const hier=BW_HIERARCHY[ex.id];
      if(hier){
        const idx=hier.indexOf(first.intensity);
        const next=idx>0?hier[idx-1]:null;
        return{level:"increase",msg:next?"🚀 Schwerere Variation: "+next:"🚀 Tempo verlangsamen",nextIntensity:next||first.intensity};
      }
      return{level:"increase",msg:"🚀 Schwieriger starten – Progressionsstufe erhöhen"};
    }
  }
  if(firstReps>=ex.targetReps*1.05)return{level:"possible",msg:"📈 Steigerung möglich – nächste Woche versuchen"};
  return{level:"ok",msg:"✓ Startintensität halten"};
}

const tag=(t,c)=>`<span class="tag" style="background:${c}22;color:${c}">${t}</span>`;
const pbox=p=>{
  const bg=p.level==="increase"?CI.green+"18":p.level==="possible"?CI.orange+"18":CI.sep+"40";
  const c=p.level==="increase"?CI.green:p.level==="possible"?CI.orange:CI.muted;
  return`<div class="prog-box" style="background:${bg};color:${c};border:1px solid ${c}50">${p.msg}</div>`;
};

// ── DATA ──
const buildData=id=>S.sessions
  .filter(s=>s.exercises?.[id])
  .map(s=>{
    const e=s.exercises[id];
    const drops=e.drops||[];
    const allReps=drops.map(d=>Number(d.reps)).filter(n=>n>0);
    const firstReps=Number(drops[0]?.reps)||0;
    const totalReps=allReps.reduce((a,b)=>a+b,0);
    const firstIntensity=drops[0]?.intensity||"";
    return{date:s.date,label:s.date.slice(5),firstReps,totalReps,numDrops:drops.length,firstIntensity,weight:parseFloat(firstIntensity)||0};
  }).sort((a,b)=>a.date.localeCompare(b.date));

function svgLine(data,key,color,h){
  h=h||80;
  const vals=data.map(d=>d[key]).filter(v=>v!=null&&v>0);
  if(vals.length<2)return'<div style="color:#7A9CC0;font-size:11px">Mindestens 2 Einheiten nötig.</div>';
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,W=300,H=h;
  const pts=data.filter(d=>d[key]>0).map((d,i,a)=>({x:i/(a.length-1||1)*W,y:H-(d[key]-mn)/rng*(H-10)-5,v:d[key],l:d.label}));
  const path=pts.map((p,i)=>(i?"L":"M")+p.x+","+p.y).join(" ");
  const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"><title>${p.l}: ${p.v}</title></circle>`).join("");
  const lbs=pts.filter((_,i)=>i===0||i===pts.length-1||pts.length<=5).map(p=>`<text x="${p.x}" y="${H+14}" text-anchor="middle" fill="#7A9CC0" font-size="9">${p.l}</text>`).join("");
  return`<svg class="chart" viewBox="0 0 ${W} ${H+18}" height="${H+18}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbs}</svg>`;
}

function navHtml(active){
  return`<nav class="nav">
    <button class="nav-btn" style="color:${active==='home'?CI.accent:CI.muted}" onclick="goTo('home')">⊕ Home</button>
    <button class="nav-btn" style="color:${active==='progress'?CI.accent:CI.muted}" onclick="goTo('progress')">↗ Verlauf</button>
  </nav>`;
}

// ── INTENSITY INPUT RENDER ──
function renderIntensityInput(ex, dropIdx, currentIntensity){
  const id=ex.id;
  const onChange=`upDropIntensity('${id}',${dropIdx},this.value)`;
  if(ex.unit==="kg"){
    return`<input class="inp-sm" type="number" inputmode="decimal"
      placeholder="kg" value="${currentIntensity}"
      oninput="${onChange}"
      style="width:62px;border-color:${CI.sep}">`;
  }
  if(ex.unit==="Band"){
    const opts=BAND_LEVELS.map(b=>`<option value="${b}"${currentIntensity===b?" selected":""}>${b}</option>`).join("");
    return`<select class="inp-sm" onchange="${onChange}" style="width:80px;background:#161E2E;border:1px solid #2A3A55;color:#fff">${opts}</select>`;
  }
  // BW
  const hier=BW_HIERARCHY[id];
  if(hier){
    const opts=hier.map(v=>`<option value="${v}"${currentIntensity===v?" selected":""}>${v}</option>`).join("");
    return`<select class="inp-sm" onchange="${onChange}" style="width:124px;background:#161E2E;border:1px solid #2A3A55;color:#fff">${opts}</select>`;
  }
  return`<span style="color:${CI.muted};font-size:12px;width:40px;display:inline-block;text-align:center">BW</span>`;
}

// ── SCREENS ──
function renderHome(){
  const today=todayKey();
  const lastOf=t=>[...S.sessions].reverse().find(s=>s.type===t);
  const doneToday=t=>S.sessions.some(s=>s.date===today&&s.type===t);
  const stats=`<div class="card" style="display:flex;margin-bottom:14px">
    ${['A','B','C'].map(t=>{const n=S.sessions.filter(s=>s.type===t).length;const c=t==='A'?CI.accent:t==='B'?CI.green:CI.purple;return`<div class="stat"><div class="stat-n" style="color:${c}">${n}</div><div class="stat-l">W-${t}</div></div>`}).join('<div style="width:1px;background:#2A3A55"></div>')}
    <div style="width:1px;background:#2A3A55"></div>
    <div class="stat"><div class="stat-n" style="color:${CI.accent}">${S.sessions.length}</div><div class="stat-l">Gesamt</div></div>
  </div>`;
  const cards=['A','B','C'].map(t=>{
    const wo=WORKOUTS[t];const done=doneToday(t);const last=lastOf(t);
    const cs=done?`background:${CI.green};border-color:${CI.green}`:'border-color:#2A3A55';
    return`<div class="card" style="border-left:3px solid ${wo.color};margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="check" style="${cs}">${done?'<span style="color:#fff;font-size:13px">✓</span>':''}</div>
        <div style="flex:1">
          <div style="color:#fff;font-weight:800;font-size:15px">${wo.label}</div>
          <div style="color:#7A9CC0;font-size:11px;margin-top:2px">${wo.subtitle} · <span style="color:${wo.color}bb">${wo.day}</span>${last?' · zuletzt '+last.date.slice(5):''}</div>
        </div>
        <button class="btn-sm" style="background:${wo.color}20;color:${wo.color};border-color:${wo.color}40" onclick="startWorkout('${t}')">${done?'Nochmal':'START →'}</button>
      </div>
    </div>`;
  }).join('');
  const recent=S.sessions.length?`<span class="lbl" style="margin-top:16px;display:block">Letzte Einheiten</span>`
    +[...S.sessions].reverse().slice(0,5).map(s=>`<div class="row">
      <span style="color:#7A9CC0;font-size:12px">${s.date}</span>
      ${tag('Workout '+s.type,WORKOUTS[s.type].color)}
    </div>`).join(''):'';
  return`<div class="hdr">
    <div><div class="hdr-title">PERFORMANCE PLAN</div><div class="hdr-sub">Thorben Reimer · ${today}</div></div>
    ${tag(S.sessions.length+' Einh.',CI.accent)}
  </div>
  <div class="body">${stats}<span class="lbl">Training starten</span>${cards}${recent}</div>
  ${navHtml('home')}`;
}

function renderWorkout(){
  const wo=WORKOUTS[S.activeType];

  // ── SAVED SCREEN ──
  if(S.saved){
    const cards=wo.exercises.map(ex=>{
      const p=S.progResults[ex.id];if(!p)return'';
      const bc=p.level==="increase"?CI.green:p.level==="possible"?CI.orange:CI.sep;
      return`<div class="card" style="border-left:3px solid ${bc}">
        <div style="color:#fff;font-weight:700;font-size:13px">${ex.name}</div>
        ${pbox(p)}
      </div>`;
    }).join('');
    return`<div class="hdr">
      <button class="back-btn" onclick="goTo('home')">←</button>
      <div style="text-align:center"><div class="hdr-title">${wo.label}</div><div class="hdr-sub">${wo.subtitle}</div></div>
      <div style="width:30px"></div>
    </div>
    <div class="body">
      <div style="text-align:center;padding:20px 0 16px">
        <div style="font-size:46px;margin-bottom:8px">💪</div>
        <div style="color:#fff;font-size:18px;font-weight:800;margin-bottom:4px">Einheit gespeichert!</div>
        <div style="color:#7A9CC0;font-size:12px;margin-bottom:16px">Empfehlung für nächste Einheit:</div>
      </div>
      ${cards}
      <button class="btn" style="background:${wo.color};margin-top:16px" onclick="goTo('home')">Zurück zur Übersicht</button>
    </div>${navHtml('')}`;
  }

  // ── ACTIVE WORKOUT ──
  const exCards=wo.exercises.map(ex=>{
    const e=S.form[ex.id]||{drops:[{intensity:'',reps:''}]};
    const drops=e.drops||[{intensity:'',reps:''}];
    const sp=S.showProg[ex.id];

    const allReps=drops.map(d=>Number(d.reps)).filter(n=>n>0);
    const totalReps=allReps.reduce((a,b)=>a+b,0);

    const ps=sp?`<div class="prog-steps">${ex.progressions.map(p=>`<div class="prog-step"><span style="color:${wo.color}">→</span> ${p}</div>`).join('')}</div>`:'';

    // Column headers
    const intensityLabel=ex.unit==='kg'?'KG':ex.unit==='Band'?'BAND':'VARIATION';
    const intensityWidth=ex.unit==='BW'&&BW_HIERARCHY[ex.id]?'124px':ex.unit==='Band'?'80px':'62px';

    const dropRows=drops.map((drop,i)=>{
      const n=Number(drop.reps);
      const bc=n>0?(n>=ex.targetReps?CI.green:n>=ex.targetReps*.8?CI.orange:CI.muted):CI.sep;
      const isStart=i===0;
      return`<div class="drop-row">
        <span class="drop-lbl" style="color:${isStart?wo.color:CI.muted}">${isStart?'START':'DROP '+i}</span>
        ${renderIntensityInput(ex,i,drop.intensity)}
        <input class="inp-sm" type="number" inputmode="numeric"
          id="dropreps_${ex.id}_${i}"
          placeholder="${ex.targetReps}" value="${drop.reps}"
          style="border-color:${bc};flex:1;min-width:0"
          oninput="upDropReps('${ex.id}',${i},this.value)">
        <span style="color:${CI.muted};font-size:10px;flex-shrink:0">Wdh</span>
        ${!isStart?`<button onclick="removeDrop('${ex.id}',${i})" style="background:${CI.red}20;border:1px solid ${CI.red}40;color:${CI.red};border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1">×</button>`:''}
      </div>`;
    }).join('');

    const summaryTags=totalReps?`<div class="tags-row">
      ${drops.map((d,i)=>{const n=Number(d.reps);if(!n)return'';const c=n>=ex.targetReps?CI.green:n>=ex.targetReps*.8?CI.orange:CI.muted;return tag((i===0?'▶ ':'↓ ')+(d.intensity?d.intensity+' · ':'')+n+' Wdh',c)}).join('')}
      ${allReps.length>1?tag('∑ '+totalReps+' Wdh',wo.color):''}
    </div>`:'';

    return`<div class="card" style="border-left:3px solid ${wo.color}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="flex:1">
          <div style="color:#fff;font-weight:700;font-size:14px">${ex.name}</div>
          <div style="color:#7A9CC0;font-size:11px;margin-top:2px">Ziel: ${ex.targetReps} Wdh · ${drops.length} Drop${drops.length!==1?'s':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          ${totalReps?`<span style="color:${wo.color};font-weight:800;font-size:16px">∑${totalReps}</span>`:''}
          <button onclick="togP('${ex.id}')" style="background:#7A9CC020;border:1px solid #2A3A55;border-radius:6px;padding:3px 8px;color:#7A9CC0;font-size:10px;cursor:pointer">${sp?'▲':'▼'}</button>
        </div>
      </div>
      ${ps}
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:0 0 4px">
        <span class="col-hdr" style="width:44px;flex-shrink:0">STUFE</span>
        <span class="col-hdr" style="width:${intensityWidth};text-align:center">${intensityLabel}</span>
        <span class="col-hdr" style="flex:1;text-align:center">WDH</span>
      </div>
      <div id="drops_${ex.id}">${dropRows}</div>
      ${summaryTags}
      <button onclick="addDrop('${ex.id}')"
        style="background:${wo.color}12;border:1px dashed ${wo.color}50;color:${wo.color};border-radius:8px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;letter-spacing:.3px">
        + Drop hinzufügen
      </button>
    </div>`;
  }).join('');

  return`<div class="hdr">
    <button class="back-btn" onclick="goTo('home')">←</button>
    <div style="text-align:center"><div class="hdr-title">${wo.label}</div><div class="hdr-sub">${wo.subtitle}</div></div>
    <div style="width:30px"></div>
  </div>
  <div class="body">${exCards}
    <button class="btn" style="background:${wo.color}" onclick="saveWo()">Einheit speichern ✓</button>
  </div>${navHtml('')}`;
}

function renderProgress(){
  if(S.progressEx){
    const ex=getAllEx().find(e=>e.id===S.progressEx);
    const wt=Object.keys(WORKOUTS).find(k=>WORKOUTS[k].exercises.find(e=>e.id===S.progressEx));
    const wo=WORKOUTS[wt];
    const data=buildData(S.progressEx);
    const hasWeight=data.some(d=>d.weight>0);

    const wc=hasWeight?`<div class="card" style="border-left:3px solid ${wo.color}">
      <div style="color:#fff;font-weight:700;font-size:13px;margin-bottom:10px">Startgewicht (kg)</div>
      ${svgLine(data,'weight',wo.color)}
    </div>`:'';
    const rc=`<div class="card" style="border-left:3px solid ${wo.color}">
      <div style="color:#fff;font-weight:700;font-size:13px;margin-bottom:10px">Gesamt-Wdh (alle Drops)</div>
      ${svgLine(data,'totalReps',wo.color)}
    </div>`;
    const dc=`<div class="card" style="border-left:3px solid ${CI.muted}">
      <div style="color:#fff;font-weight:700;font-size:13px;margin-bottom:10px">Anzahl Drops</div>
      ${svgLine(data,'numDrops',CI.muted,50)}
    </div>`;
    const rows=[...data].reverse().map(d=>`<div class="row">
      <span style="color:#7A9CC0;font-size:12px">${d.date}</span>
      <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        ${tag('▶ '+d.firstIntensity,wo.color)}
        ${tag(d.numDrops+' Drops',CI.muted)}
        ${tag('∑'+d.totalReps,CI.green)}
      </div>
    </div>`).join('');

    return`<div class="hdr">
      <button class="back-btn" onclick="set({progressEx:null})">←</button>
      <div style="text-align:center"><div class="hdr-title">${ex?.name||''}</div><div class="hdr-sub">${data.length} Einheiten</div></div>
      <div style="width:30px"></div>
    </div>
    <div class="body">${!data.length?'<div style="text-align:center;padding:40px;color:#7A9CC0">Noch keine Daten.</div>':wc+rc+dc+'<span class="lbl" style="margin-top:6px;display:block">Alle Einträge</span>'+rows}</div>
    ${navHtml('progress')}`;
  }

  const cards=['A','B','C'].map(t=>{
    const wo=WORKOUTS[t];
    const has=wo.exercises.some(ex=>buildData(ex.id).length>0);
    if(!has)return'';
    return`<div style="margin-top:12px">
      <span class="lbl" style="color:${wo.color}">${wo.label} · ${wo.subtitle}</span>
      ${wo.exercises.map(ex=>{
        const data=buildData(ex.id);if(!data.length)return'';
        const lat=data[data.length-1];
        const diffTotal=data.length>1?lat.totalReps-data[0].totalReps:null;
        return`<div class="card" style="border-left:3px solid ${wo.color};cursor:pointer" onclick="set({progressEx:'${ex.id}'})">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="color:#fff;font-weight:700;font-size:13px">${ex.name}</div>
              <div style="color:#7A9CC0;font-size:11px;margin-top:2px">${data.length} Einh. · Start: <span style="color:${wo.color}">${lat.firstIntensity}</span> · ∑ <span style="color:${wo.color}">${lat.totalReps}</span> Wdh</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${diffTotal!==null?tag((diffTotal>0?'+':'')+diffTotal+'∑',diffTotal>0?CI.green:diffTotal<0?CI.orange:CI.muted):''}
              <span style="color:#7A9CC0;font-size:16px">›</span>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return`<div class="hdr">
    <div style="width:30px"></div>
    <div style="text-align:center"><div class="hdr-title">FORTSCHRITT</div><div class="hdr-sub">${S.sessions.length} Einheiten gesamt</div></div>
    <div style="width:30px"></div>
  </div>
  <div class="body">${!S.sessions.length?'<div style="text-align:center;padding:60px 20px"><div style="font-size:40px;margin-bottom:12px">📊</div><div style="color:#7A9CC0;font-size:14px">Nach der ersten Einheit erscheinen hier deine Grafiken.</div></div>':cards}</div>
  ${navHtml('progress')}`;
}

function render(){
  const app=document.getElementById('app');
  if(S.view==='home')app.innerHTML=renderHome();
  else if(S.view==='workout')app.innerHTML=renderWorkout();
  else if(S.view==='progress')app.innerHTML=renderProgress();
}

// ── EVENT HANDLERS ──
window.goTo=v=>set({view:v,progressEx:null});

window.startWorkout=t=>{
  const last=[...S.sessions].reverse().find(s=>s.type===t);
  const init={};
  WORKOUTS[t].exercises.forEach(ex=>{
    const le=last?.exercises?.[ex.id];
    const firstIntensity=getInitialIntensity(ex,le);
    init[ex.id]={drops:[{intensity:firstIntensity,reps:''}]};
  });
  set({form:init,activeType:t,saved:false,progResults:{},showProg:{},view:'workout'});
};

window.upDropIntensity=(id,i,val)=>{
  const drops=[...S.form[id].drops];
  drops[i]={...drops[i],intensity:val};
  S.form[id]={...S.form[id],drops};
  // No full re-render – keeps select/input focus
};

window.upDropReps=(id,i,val)=>{
  const drops=[...S.form[id].drops];
  drops[i]={...drops[i],reps:val};
  S.form[id]={...S.form[id],drops};
  // Update border color only
  const wo=WORKOUTS[S.activeType];if(!wo)return;
  const ex=wo.exercises.find(e=>e.id===id);if(!ex)return;
  const n=Number(val);
  const inp=document.getElementById('dropreps_'+id+'_'+i);
  if(inp)inp.style.borderColor=n>0?(n>=ex.targetReps?CI.green:n>=ex.targetReps*.8?CI.orange:CI.muted):CI.sep;
};

window.addDrop=(id)=>{
  const ex=getAllEx().find(e=>e.id===id);
  const drops=[...S.form[id].drops];
  const last=drops[drops.length-1];
  const nextIntensity=getNextDropIntensity(ex,last.intensity);
  drops.push({intensity:nextIntensity,reps:''});
  S.form[id]={...S.form[id],drops};
  render();
};

window.removeDrop=(id,i)=>{
  const drops=[...S.form[id].drops];
  drops.splice(i,1);
  S.form[id]={...S.form[id],drops};
  render();
};

window.togP=id=>{S.showProg={...S.showProg,[id]:!S.showProg[id]};render()};

window.saveWo=()=>{
  const wo=WORKOUTS[S.activeType];
  const results={};
  const enriched={...S.form};
  wo.exercises.forEach(ex=>{
    const e=S.form[ex.id];
    const p=calcProg(ex,e.drops||[]);
    results[ex.id]=p;
    if(p?.nextIntensity){
      enriched[ex.id]={...e,suggestedNextIntensity:p.nextIntensity};
    }
  });
  const entry={date:todayKey(),type:S.activeType,exercises:enriched};
  const updated=[...S.sessions.filter(s=>!(s.date===entry.date&&s.type===entry.type)),entry];
  S.sessions=updated;
  persist(updated);
  set({progResults:results,saved:true});
};

render();
</script>
</body>
</html>
